[vars]
VAPID_PUBLIC = "BJsTMSBuBIkeJvM7XP_9sUTeSQNvR1XSXJ_zmuZw3Mlipe7yUwwqb9IgnzpyBacLuRed6yLr2B2UGmS0FcqQXqQ"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "HandoffRoom"

[[durable_objects.bindings]]
name = "LIMITS"
